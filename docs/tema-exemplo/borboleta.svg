<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110">
  <defs>
    <radialGradient id="asaFrente" cx="35%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#fbdce1"/>
      <stop offset="55%" stop-color="#f2b8c0"/>
      <stop offset="100%" stop-color="#e29daa"/>
    </radialGradient>
    <radialGradient id="asaTras" cx="40%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#f9e3e7"/>
      <stop offset="100%" stop-color="#eeadb8"/>
    </radialGradient>
    <style>
      .asa { transform-box: view-box; transform-origin: 60px 56px; animation: bater .55s ease-in-out infinite alternate; }
      @keyframes bater { from { transform: scaleX(1); } to { transform: scaleX(.4); } }
    </style>
  </defs>

  <!-- Asa direita -->
  <g class="asa">
    <path d="M61 52 C 73 30, 94 14, 111 19 C 118 33, 111 52, 90 61 C 79 65, 68 61, 61 55 Z"
          fill="url(#asaFrente)" stroke="#c98a96" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M61 58 C 73 57, 91 61, 99 73 C 103 87, 92 100, 78 96 C 66 92, 60 78, 60 64 Z"
          fill="url(#asaTras)" stroke="#c98a96" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M62 52 C 76 40, 92 27, 107 23 M62 54 C 77 46, 91 43, 103 45 M61 60 C 74 64, 86 71, 95 80 M61 62 C 70 70, 76 80, 80 90"
          fill="none" stroke="#8a8c55" stroke-width="1" opacity=".45"/>
    <circle cx="102" cy="29" r="2.6" fill="#fdf8f3" opacity=".95"/>
    <circle cx="107" cy="40" r="1.8" fill="#fdf8f3" opacity=".85"/>
    <circle cx="90" cy="86" r="2.2" fill="#fdf8f3" opacity=".9"/>
  </g>

  <!-- Asa esquerda (espelho) -->
  <g class="asa">
    <g transform="matrix(-1,0,0,1,120,0)">
      <path d="M61 52 C 73 30, 94 14, 111 19 C 118 33, 111 52, 90 61 C 79 65, 68 61, 61 55 Z"
            fill="url(#asaFrente)" stroke="#c98a96" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M61 58 C 73 57, 91 61, 99 73 C 103 87, 92 100, 78 96 C 66 92, 60 78, 60 64 Z"
            fill="url(#asaTras)" stroke="#c98a96" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M62 52 C 76 40, 92 27, 107 23 M62 54 C 77 46, 91 43, 103 45 M61 60 C 74 64, 86 71, 95 80 M61 62 C 70 70, 76 80, 80 90"
            fill="none" stroke="#8a8c55" stroke-width="1" opacity=".45"/>
      <circle cx="102" cy="29" r="2.6" fill="#fdf8f3" opacity=".95"/>
      <circle cx="107" cy="40" r="1.8" fill="#fdf8f3" opacity=".85"/>
      <circle cx="90" cy="86" r="2.2" fill="#fdf8f3" opacity=".9"/>
    </g>
  </g>

  <!-- Corpo, cabeça e antenas -->
  <ellipse cx="60" cy="60" rx="3.2" ry="17" fill="#6b6d3f"/>
  <ellipse cx="60" cy="46" rx="3.6" ry="5" fill="#7d7f4c"/>
  <circle cx="60" cy="38" r="4" fill="#6b6d3f"/>
  <path d="M57.5 35 C 52 27, 46 23, 40 22 M62.5 35 C 68 27, 74 23, 80 22"
        fill="none" stroke="#6b6d3f" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="40" cy="22" r="1.7" fill="#6b6d3f"/>
  <circle cx="80" cy="22" r="1.7" fill="#6b6d3f"/>
</svg>
