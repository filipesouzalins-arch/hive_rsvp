<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-label="Camisa amarela número 8 sobre distintivo">
  <style>
    @keyframes quicaB { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-16px) rotate(60deg); } }
    .bolaB { animation: quicaB 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: reduce) { .bolaB { animation: none; } }
  </style>
  <defs>
    <filter id="sombraCamisa" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="0" flood-color="#002776" flood-opacity=".35"/>
    </filter>
    <clipPath id="bolaBrasao"><circle cx="50" cy="50" r="44"/></clipPath>
  </defs>

  <!-- Distintivo: losango amarelo + círculo marinho -->
  <polygon points="300,10 590,210 300,410 10,210" fill="#FFD21F"/>
  <circle cx="300" cy="210" r="118" fill="#002776"/>
  <path d="M186 186 Q300 150 414 214" fill="none" stroke="#FFFFFF" stroke-width="16"/>
  <g fill="#FFFFFF">
    <circle cx="250" cy="240" r="4"/><circle cx="285" cy="262" r="3"/><circle cx="320" cy="250" r="4"/>
    <circle cx="350" cy="280" r="3"/><circle cx="300" cy="295" r="5"/><circle cx="262" cy="282" r="3"/>
    <circle cx="365" cy="240" r="3"/><circle cx="230" cy="265" r="2.5"/><circle cx="330" cy="310" r="2.5"/>
  </g>

  <!-- Camisa 8 -->
  <g transform="translate(300,186) scale(1.063) translate(-150,-151)" filter="url(#sombraCamisa)">
    <g transform="translate(0,6)">
      <path d="M96 28 L132 16 Q150 38 168 16 L204 28 L276 78 L246 132 L214 114 L214 274 Q150 284 86 274 L86 114 L54 132 L24 78 Z" fill="#FFD21F" stroke="#002776" stroke-width="7" stroke-linejoin="round"/>
      <path d="M132 16 Q150 38 168 16" fill="none" stroke="#00843D" stroke-width="12" stroke-linecap="round"/>
      <path d="M30 86 L54 132" stroke="#00843D" stroke-width="12" stroke-linecap="round"/>
      <path d="M270 86 L246 132" stroke="#00843D" stroke-width="12" stroke-linecap="round"/>
      <path d="M90 262 Q150 272 210 262" fill="none" stroke="#00843D" stroke-width="8" stroke-linecap="round"/>
      <text x="150" y="230" text-anchor="middle" font-family="'Lilita One','Arial Black',Arial,sans-serif" font-weight="900" font-size="175" fill="#00843D" stroke="#002776" stroke-width="7" paint-order="stroke fill">8</text>
    </g>
  </g>

  <!-- Bola quicando no ombro direito (a classe animada fica num grupo sem
       transform próprio: animação CSS sobrescreveria o atributo transform) -->
  <g transform="translate(403,14)">
  <g class="bolaB">
    <g transform="scale(0.89)">
      <circle cx="50" cy="50" r="44" fill="#FFFFFF"/>
      <g clip-path="url(#bolaBrasao)" fill="#002776">
        <polygon points="50,34 65,45 59,62 41,62 35,45"/>
        <polygon points="50,2 64,10 58,22 42,22 36,10"/>
        <polygon points="94,40 98,58 86,64 76,52 82,38"/>
        <polygon points="76,88 66,100 52,96 56,82 70,78"/>
        <polygon points="24,88 34,100 48,96 44,82 30,78"/>
        <polygon points="6,40 2,58 14,64 24,52 18,38"/>
      </g>
      <circle cx="50" cy="50" r="44" fill="none" stroke="#002776" stroke-width="5"/>
    </g>
  </g>
  </g>
</svg>
